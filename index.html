<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #101114;
      color: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background: radial-gradient(
        ellipse at top,
        #252832 0%,
        #101114 60%
      );
    }

    main {
      width: min(900px, 100%);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
    }

    .intro {
      color: #b8bbc5;
      margin-bottom: 28px;
    }

    .panel {
      padding: 28px;
      border: 1px solid #343741;
      border-radius: 18px;
      background: #1a1c22;
      box-shadow: 0 18px 55px #0006;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-weight: 650;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 14px 15px;
      border: 1px solid #454956;
      border-radius: 10px;
      background: #101217;
      color: white;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #ff5252;
    }

    button {
      padding: 13px 19px;
      border: 0;
      border-radius: 10px;
      background: #e62117;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #c91c14;
    }

    .hint {
      margin-top: 10px;
      color: #9da1ad;
      font-size: .9rem;
    }

    #message {
      min-height: 1.5em;
      margin-top: 12px;
      color: #ff9292;
    }

    .video-wrap {
      display: none;
      overflow: hidden;
      margin-top: 24px;
      border-radius: 14px;
      background: black;
      aspect-ratio: 16 / 9;
    }

    .video-wrap.visible {
      display: block;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 560px) {
      .controls {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main>

    <h1>Lecteur</h1>

    <p class="intro">
      Collez le lien d’une vidéo YouTube
      pour la regarder directement ici.
    </p>

    <section class="panel">

      <form id="youtube-form">

        <label for="youtube-url">
          URL de la vidéo YouTube
        </label>

        <div class="controls">

          <input
            id="youtube-url"
            type="url"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="url"
            required
          >

          <button type="submit">
            Afficher la vidéo
          </button>

        </div>

        <p class="hint">
          Liens youtube.com, youtu.be et Shorts acceptés.
        </p>

        <p id="message" role="status" aria-live="polite"></p>

      </form>

      <div id="video-wrap" class="video-wrap">

        <iframe
          id="youtube-player"
          title="Lecteur vidéo YouTube"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>

      </div>

    </section>

  </main>

  <script>

    const form = document.getElementById('youtube-form');
    const input = document.getElementById('youtube-url');
    const player = document.getElementById('youtube-player');
    const videoWrap = document.getElementById('video-wrap');
    const message = document.getElementById('message');

    // Extraction de l'identifiant de la vidéo
    function getYouTubeVideoId(rawUrl) {

      let url;

      try {
        url = new URL(rawUrl.trim());
      } catch {
        return null;
      }

      const host = url.hostname
        .toLowerCase()
        .replace(/^www\./, '');

      let id = null;

      if (host === 'youtu.be') {

        id = url.pathname
          .split('/')
          .filter(Boolean)[0];

      } else if (
        [
          'youtube.com',
          'm.youtube.com',
          'music.youtube.com'
        ].includes(host)
      ) {

        if (url.pathname === '/watch') {

          id = url.searchParams.get('v');

        } else {

          const parts = url.pathname
            .split('/')
            .filter(Boolean);

          if (
            ['embed', 'shorts', 'live', 'v']
            .includes(parts[0])
          ) {
            id = parts[1];
          }
        }
      }

      return id && /^[a-zA-Z0-9_-]{11}$/.test(id)
        ? id
        : null;
    }

    // Affichage de la vidéo
    form.addEventListener('submit', (event) => {

      event.preventDefault();

      const videoId = getYouTubeVideoId(input.value);

      if (!videoId) {

        player.src = '';

        videoWrap.classList.remove('visible');

        message.textContent =
          "Lien invalide. Collez l’URL d’une vidéo YouTube valide.";

        return;
      }

      message.textContent = '';

      // Lecteur nocookie
      player.src = `https://www.youtube-nocookie.com/embed/${videoId}`;
      videoWrap.classList.add('visible');

    });

  </script>

</body>
</html>
